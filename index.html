<!--
  =========================================================
  HOW TO CUSTOMIZE THIS SITE
  =========================================================
  1. Logo: header shows "NP" (brand initials). Change it in the
     .brand button near the top of <body>.
  2. PROJECTS (id="work"): each <article class="proj"> is one photo.
     - Swap .proj__frame background (currently a CSS placeholder)
       for a real image:
         <div class="proj__frame ph-architecture" style="background-image:url('photos/your-file.jpg')"></div>
       Keep background-size:cover; background-position:center (already in CSS).
     - data-type="personal|commercial" and data-category="architecture|fashion|wedding"
       control the two filter rows (Type and Category) — set them per photo.
       MULTI-TAG: a photo can belong to several categories (or even both types)
       at once — just separate values with a space:
         data-type="commercial"
         data-category="fashion wedding"
       It will then show up under BOTH the Fashion and Weddings filters.
     - To add a NEW category later (e.g. "portrait"):
         a) add a button in the "Category" filter-group
         b) use data-category="portrait" on the relevant <article> tags
         c) optionally add a .ph-portrait gradient in the CSS placeholder section
  3. TRANSLATIONS: any element with data-en="..." data-fr="..." is auto-translated
     by the EN/FR toggle in the header — just edit those attributes directly.
  4. CONTACT: update the email in the floating button (bottom-right) and in the
     footer Instagram link.
  5. Fonts are self-hosted and embedded directly in this file (base64) — no
     external network requests at all.
  =========================================================
-->

  :root{
    --paper:  #FFFFFF;
    --paper2: #F2F2F2;
    --ink:    #0A0A0A;
    --mute:   #7A7A7A;
    --line:   #E4E4E4;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; overflow-x:hidden; }
  html,body{ width:100%; max-width:100%; }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Archivo', sans-serif;
    font-weight:500;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; text-decoration:none; }

  /* ---------- header ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:50;
    background:rgba(255,255,255,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px;
  }

  .brand{
    font-weight:900; text-transform:uppercase; letter-spacing:-0.02em; font-size:2.1rem;
    background:none; border:none; cursor:pointer; color:var(--ink); font-family:'Archivo', sans-serif;
    padding:0;
  }

  .nav__right{ display:flex; align-items:center; gap:30px; }
  .nav__links{ display:flex; gap:24px; }
  .nav__links button{
    background:none; border:none; font-family:'Archivo'; font-weight:700; font-size:0.76rem;
    text-transform:uppercase; letter-spacing:0.04em; color:var(--ink);
    cursor:pointer; padding:0; position:relative;
  }
  .nav__links button::after{
    content:""; position:absolute; left:0; bottom:-4px; height:2px; width:0;
    background:var(--ink); transition:width .25s ease;
  }
  .nav__links button:hover::after{ width:100%; }
  .nav__links button.is-active::after{ width:100%; }
  .nav__links button.nav__contact{ color:var(--mute); }
  .nav__links button.nav__contact:hover{ color:var(--ink); }

  .lang-toggle{ display:flex; gap:8px; font-size:0.74rem; font-weight:700; }
  .lang-toggle button{
    background:none; border:none; cursor:pointer; font-family:'Archivo'; font-weight:700;
    color:var(--mute); padding:2px 0;
  }
  .lang-toggle button.is-active{ color:var(--ink); border-bottom:2px solid var(--ink); }

  @media (max-width:640px){ .nav__links{ display:none; } .nav{ padding:16px 18px; } }

  /* ---------- work / filters ---------- */
  #work{ padding-top:60px; scroll-margin-top:64px; }

  .filter-group{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; padding:14px 28px; }
  .filter-group + .filter-group{ border-top:1px solid var(--line); }
  .filter-group{ border-bottom:1px solid var(--line); }
  .filter-group__label{
    font-family:'Archivo'; font-weight:700; text-transform:uppercase; font-size:0.68rem;
    letter-spacing:0.06em; color:#B5B5B5; margin-right:4px; min-width:64px;
  }
  @media (max-width:640px){ .filter-group{ padding:12px 18px; } }

  .filters button{
    background:none; border:none; cursor:pointer; font-family:'Archivo'; font-weight:700;
    text-transform:uppercase; font-size:0.74rem; letter-spacing:0.03em; color:var(--mute); padding:3px 0;
    border-bottom:2px solid transparent;
  }
  .filters button.is-active{ color:var(--ink); border-bottom-color:var(--ink); }
  .filters button:hover{ color:var(--ink); }

  .grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:3px;
  }
  @media (max-width:1000px){ .grid{ grid-template-columns:repeat(3, 1fr); } }
  @media (max-width:700px){ .grid{ grid-template-columns:repeat(2, 1fr); } }
  @media (max-width:420px){ .grid{ grid-template-columns:1fr; } }

  .proj{ transition:opacity .3s ease; }
  .proj.is-hidden{ display:none; }

  .proj__frame{
    aspect-ratio:4/5; position:relative; overflow:hidden; cursor:pointer;
    background-size:cover; background-position:center;
  }
  .proj__frame::before{
    content:""; position:absolute; inset:0; background:var(--ink); opacity:0;
    transition:opacity .3s ease;
  }
  .proj:hover .proj__frame::before, .proj:focus-within .proj__frame::before{ opacity:0.12; }

  .ph-architecture{ background:linear-gradient(160deg,#d4d4d4,#8f8f8f 55%,#3a3a3a); }
  .ph-fashion{ background:linear-gradient(155deg,#e8e8e8,#a8a8a8 50%,#242424); }
  .ph-wedding{ background:linear-gradient(165deg,#dcdcdc,#8a8a8a 55%,#2e2e2e); }

  .proj__title{
    position:absolute; left:14px; bottom:12px;
    font-weight:800; text-transform:uppercase; font-size:0.78rem; letter-spacing:0.02em;
    color:#fff; opacity:0; transform:translateY(6px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .proj:hover .proj__title, .proj:focus-within .proj__title{ opacity:1; transform:translateY(0); }

  .proj{ opacity:0; transform:translateY(14px); transition:opacity .5s ease, transform .5s ease; }
  .proj.is-visible{ opacity:1; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce){ .proj{ opacity:1; transform:none; transition:none; } }

  /* ---------- floating contact button ---------- */
  .fab-contact{
    position:fixed; right:20px; bottom:20px; z-index:40;
    background:var(--ink); color:#fff;
    font-family:'Archivo'; font-weight:800; text-transform:uppercase;
    font-size:0.76rem; letter-spacing:0.03em;
    padding:14px 20px; cursor:pointer; border:none;
    box-shadow:0 4px 18px rgba(0,0,0,0.18);
    transition:background .2s ease, transform .2s ease;
  }
  .fab-contact:hover{ background:#333; transform:translateY(-2px); }
  @media (max-width:640px){ .fab-contact{ right:14px; bottom:14px; padding:12px 16px; font-size:0.7rem; } }

  /* ---------- footer ---------- */
  footer{
    border-top:1px solid var(--line);
    padding:16px 18px; font-size:0.72rem; color:var(--mute); font-weight:600;
    display:flex; align-items:center; justify-content:space-between;
  }
  footer a:hover{ color:var(--ink); }
  @media (min-width:640px){
    footer{ padding:18px 28px; }
  }

  /* ---------- cinematic intro ---------- */
  .intro{
    position:fixed; inset:0; z-index:9999;
    background:#0A0A0A;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .intro[hidden]{ display:none; }

  .intro__zoom{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  .intro__drift{
    display:flex; align-items:center; justify-content:center;
    animation:introDrift 6s ease-in-out infinite alternate;
  }
  @keyframes introDrift{ from{ transform:scale(1); } to{ transform:scale(1.06); } }

  .intro__np{
    position:relative;
    font-family:'Archivo', sans-serif; font-weight:900; text-transform:uppercase;
    letter-spacing:-0.05em; line-height:0.86;
    font-size:clamp(5rem, 34vw, 26rem);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    background-size:120% 120%; background-position:center;
  }
  .intro__np--a, .intro__np--b{
    position:absolute; inset:0; opacity:0;
    transition:opacity .55s ease;
  }
  .intro__np--a.is-on, .intro__np--b.is-on{ opacity:1; }

  .intro__skip{
    position:absolute; right:22px; bottom:22px;
    background:rgba(0,0,0,0.35); border:1.5px solid rgba(255,255,255,0.9); cursor:pointer;
    font-family:'Archivo', sans-serif; font-weight:800; text-transform:uppercase;
    font-size:0.72rem; letter-spacing:0.06em; color:#fff;
    padding:10px 18px; opacity:0; transition:opacity .5s ease, background .2s ease;
  }
  .intro__skip.is-visible{ opacity:1; }
  .intro__skip:hover{ background:rgba(255,255,255,0.15); }
  @media (min-width:640px){ .intro__skip{ right:28px; bottom:28px; } }

  @keyframes introZoomThrough{
    0%   { transform:scale(1);  filter:blur(0px); }
    55%  { transform:scale(6);  filter:blur(1px); }
    100% { transform:scale(24); filter:blur(14px); }
  }
  @keyframes introFadeOut{
    0%   { opacity:1; }
    60%  { opacity:1; }
    100% { opacity:0; }
  }
  .intro.is-leaving .intro__zoom{ animation:introZoomThrough 1.05s cubic-bezier(.6,0,.9,.2) forwards; }
  .intro.is-leaving{ animation:introFadeOut 1.05s ease forwards; pointer-events:none; }
  .intro.is-leaving .intro__skip{ opacity:0; }

  @media (prefers-reduced-motion: reduce){
    .intro__drift{ animation:none; }
    .intro.is-leaving .intro__zoom{ animation:none; opacity:0; transition:opacity .3s ease; }
    .intro.is-leaving{ animation:none; opacity:0; transition:opacity .3s ease; }
  }
</style>
</head>
<body>

<!--
  INTRO: cinematic entrance. Runs once per browser session (sessionStorage flag).
  Swap the placeholder looks (ph-architecture / ph-fashion / ph-wedding) for real
  photos once you have them: point .intro__np--a / --b at background-image:url(...).
-->
<div id="intro" class="intro">
  <div class="intro__zoom">
    <div class="intro__drift">
      <div class="intro__np">
        <span class="intro__np--a ph-architecture is-on">NP</span>
        <span class="intro__np--b ph-fashion">NP</span>
      </div>
    </div>
  </div>
  <button type="button" class="intro__skip" id="introSkip" data-en="Skip Intro" data-fr="Passer l'intro">Skip Intro</button>
</div>

<header>
  <nav class="nav">
    <button type="button" class="brand" id="logoHome">NP</button>
    <div class="nav__right">
      <div class="nav__links">
        <button type="button" data-type-nav="personal" data-en="Personal" data-fr="Personnel">Personal</button>
        <button type="button" data-type-nav="commercial" data-en="Commercial" data-fr="Commercial">Commercial</button>
        <button type="button" class="nav__contact" id="navContact" data-en="Contact" data-fr="Contact">Contact</button>
      </div>
      <div class="lang-toggle">
        <button type="button" data-lang="en" class="is-active">EN</button>
        <span style="color:var(--line)">/</span>
        <button type="button" data-lang="fr">FR</button>
      </div>
    </div>
  </nav>
</header>

<main>

  <section id="work">
    <div class="filter-group filters">
      <span class="filter-group__label" data-en="Category" data-fr="Catégorie">Category</span>
      <button type="button" data-category-filter="all" class="is-active" data-en="All" data-fr="Tout">All</button>
      <button type="button" data-category-filter="architecture" data-en="Architecture" data-fr="Architecture">Architecture</button>
      <button type="button" data-category-filter="fashion" data-en="Fashion" data-fr="Mode">Fashion</button>
      <button type="button" data-category-filter="wedding" data-en="Weddings" data-fr="Mariages">Weddings</button>
    </div>

    <div class="grid">

      <article class="proj" data-type="personal" data-category="architecture" tabindex="0">
        <div class="proj__frame ph-architecture"><div class="proj__title">Concrete Line</div></div>
      </article>

      <article class="proj" data-type="commercial" data-category="fashion" tabindex="0">
        <div class="proj__frame ph-fashion"><div class="proj__title">Maison Verel</div></div>
      </article>

      <article class="proj" data-type="personal" data-category="architecture" tabindex="0">
        <div class="proj__frame ph-architecture"><div class="proj__title">Vertical Rest</div></div>
      </article>

      <article class="proj" data-type="commercial" data-category="wedding" tabindex="0">
        <div class="proj__frame ph-wedding"><div class="proj__title">Lucie &amp; Anouk</div></div>
      </article>

      <article class="proj" data-type="personal" data-category="architecture" tabindex="0">
        <div class="proj__frame ph-architecture"><div class="proj__title">Threshold</div></div>
      </article>

      <article class="proj" data-type="commercial" data-category="fashion wedding" tabindex="0">
        <div class="proj__frame ph-fashion"><div class="proj__title">Rive Éditorial</div></div>
      </article>
      <!-- ^ example of a photo tagged in two categories at once (multi-tag) -->

      <article class="proj" data-type="commercial" data-category="wedding" tabindex="0">
        <div class="proj__frame ph-wedding"><div class="proj__title">Camille &amp; Théo</div></div>
      </article>

      <article class="proj" data-type="personal" data-category="architecture" tabindex="0">
        <div class="proj__frame ph-architecture"><div class="proj__title">Grey Modern</div></div>
      </article>

      <article class="proj" data-type="commercial" data-category="fashion" tabindex="0">

</main>

<button type="button" class="fab-contact" id="fabContact" data-en="Let's work together" data-fr="Travaillons ensemble">Let's work together</button>

<footer>
  <span>&copy; <span id="year"></span> NP</span>
  <a href="#" target="_blank" rel="noopener">Instagram</a>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---------- language toggle ---------- */
  let currentLang = 'en';
  const langButtons = document.querySelectorAll('[data-lang]');
  langButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      currentLang = btn.dataset.lang;
      document.documentElement.lang = currentLang;
      langButtons.forEach(b => b.classList.toggle('is-active', b.dataset.lang === currentLang));
      document.querySelectorAll('[data-en]').forEach(el => {
        el.textContent = currentLang === 'fr' ? el.dataset.fr : el.dataset.en;
      });
    });
  });

  /* ---------- filters: Type lives in header nav, Category in the filter bar ---------- */
  const typeNavButtons = document.querySelectorAll('[data-type-nav]');
  const categoryButtons = document.querySelectorAll('[data-category-filter]');
  const projects = document.querySelectorAll('.proj');

  let activeType = 'all';
  let activeCategory = 'all';

  function applyFilters(){
    typeNavButtons.forEach(b => b.classList.toggle('is-active', b.dataset.typeNav === activeType));
    categoryButtons.forEach(b => b.classList.toggle('is-active', b.dataset.categoryFilter === activeCategory));
    projects.forEach(p => {
      const typeMatch = activeType === 'all' || p.dataset.type.split(' ').includes(activeType);
      const categoryMatch = activeCategory === 'all' || p.dataset.category.split(' ').includes(activeCategory);
      p.classList.toggle('is-hidden', !(typeMatch && categoryMatch));
    });
  }

  categoryButtons.forEach(btn => {
    btn.addEventListener('click', () => { activeCategory = btn.dataset.categoryFilter; applyFilters(); });
  });

  /* clicking Personal/Commercial again toggles back to "all" */
  typeNavButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      activeType = (activeType === btn.dataset.typeNav) ? 'all' : btn.dataset.typeNav;
      applyFilters();
      document.getElementById('work').scrollIntoView({ behavior:'smooth' });
    });
  });

  /* ---------- contact: floating button + nav button, same action ---------- */
  function openContact(){ window.location.href = 'mailto:hello@np-photo.com'; }
  document.getElementById('fabContact').addEventListener('click', openContact);
  document.getElementById('navContact').addEventListener('click', openContact);

  /* ---------- logo: always returns to top, never replays the intro ---------- */
  document.getElementById('logoHome').addEventListener('click', () => {
    window.scrollTo({ top:0, behavior:'smooth' });
  });

  /* ---------- scroll reveal ---------- */
  if('IntersectionObserver' in window){
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    projects.forEach(p => io.observe(p));
  } else {
    projects.forEach(p => p.classList.add('is-visible'));
  }

  /* ---------- cinematic intro ---------- */
  (function initIntro(){
    const intro = document.getElementById('intro');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const alreadySeen = sessionStorage.getItem('npIntroSeen');

    if(alreadySeen || reduceMotion){
      intro.hidden = true;
      return;
    }

    sessionStorage.setItem('npIntroSeen', '1');
    document.body.style.overflow = 'hidden';

    const looks = ['ph-architecture', 'ph-fashion', 'ph-wedding'];
    const layerA = intro.querySelector('.intro__np--a');
    const layerB = intro.querySelector('.intro__np--b');
    const skipBtn = document.getElementById('introSkip');
    let i = 1;
    let onA = true;
    let cycleTimer = null;
    let leaving = false;

    function swapLook(){
      const next = looks[i % looks.length];
      const showing = onA ? layerB : layerA;
      const hiding  = onA ? layerA : layerB;
      looks.forEach(l => showing.classList.remove(l));
      showing.classList.add(next);
      showing.classList.add('is-on');
      hiding.classList.remove('is-on');
      onA = !onA;
      i++;
    }

    function cycle(intervalMs){
      clearInterval(cycleTimer);
      cycleTimer = setInterval(swapLook, intervalMs);
    }

    cycle(780);
    setTimeout(() => cycle(480), 2000);
    setTimeout(() => skipBtn.classList.add('is-visible'), 900);

    function leaveIntro(){
      if(leaving) return;
      leaving = true;
      clearInterval(cycleTimer);
      intro.classList.add('is-leaving');
      window.setTimeout(() => {
        intro.hidden = true;
        document.body.style.overflow = '';
      }, reduceMotion ? 320 : 1100);
    }

    skipBtn.addEventListener('click', leaveIntro);
    setTimeout(leaveIntro, 4200);
  })();
</script>

</body>
</html>
